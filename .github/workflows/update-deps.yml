name: Update Dependencies and Test build

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 2'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Show current outdated packages
        run: |
          echo "📦 Current outdated packages:"
          npx npm-check-updates --format json || echo "No updates available"

      - name: Update dependencies
        run: |
          echo "🔄 Upgrading dependencies to latest versions..."
          npx npm-check-updates -u

      - name: Install updated dependencies
        run: |
          echo "📥 Installing updated packages..."
          npm install

      - name: Audit dependencies for vulnerabilities
        run: |
          echo "🔍 Running security audit..."
          npm audit --json > audit-results.json || true
          HIGH=$(jq '.vulnerabilities.high // 0' audit-results.json)
          CRITICAL=$(jq '.vulnerabilities.critical // 0' audit-results.json)
          echo "Found ${HIGH} high and ${CRITICAL} critical vulnerabilities."
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Failing build due to high/critical vulnerabilities."
            exit 1
          fi
          echo "✅ No high or critical vulnerabilities found."

      - name: Build the project
        run: |
          echo "🏗️ Building the project..."
          npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/tailwind.css package.json package-lock.json tsconfig.json

          if git diff --cached --quiet; then
            echo "ℹ️ No dependency updates to commit."
            exit 0
          fi

          git commit -m "chore: update dependencies"
          git push
          echo "✅ Changes committed and pushed."
